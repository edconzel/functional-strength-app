<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="slb-checker" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="#131238"/>
      <rect width="64" height="64" fill="#1d1c52"/>
