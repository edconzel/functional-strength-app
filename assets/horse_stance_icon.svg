<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="hs-checker" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="#131238"/>
      <rect width="64" height="64" fill="#1d1c52"/>
      <rect x="64" y="64" width="64" height="64" fill="#1d1c52"/>
    </pattern>
    <filter id="hs-glow" x="-40%" y="-40%" width="180%" height="180%">
